[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-ticket-platform"
version = "1.0.0"
description = "Provider-agnostic LLM ticket classification platform with a custom inference backend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
local = [
  "torch>=2.0.0",
  "transformers>=4.35.0",
  "accelerate>=0.24.0",
]
test = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
include = ["llm*", "prompts*", "structured*", "evaluation*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
